spring.application.name=SemaforoInteligente

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/semaforointeligente?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=fiap

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-stacktrace=never

api.security.token.secret=${JWT_SECRET:12345678}

api.security.allowed-origins=\
  http://localhost:*,\
  http://127.0.0.1:*

# MQTT (broker Mosquitto local ou HiveMQ publico). Desligado por padrao para a API subir sem broker.
mqtt.enabled=${MQTT_ENABLED:false}
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:semaforo-backend}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.qos=1

# Regras de negocio
semaforo.ciclo.duracao-segundos=120
semaforo.ciclo.verde-minimo-segundos=15
semaforo.ciclo.amarelo-segundos=3
semaforo.offline.timeout-segundos=60
emergencia.raio-liberacao-metros=300
emergencia.largura-corredor-metros=150
emergencia.tolerancia-desvio-metros=500
emergencia.velocidade-maxima-kmh=180
